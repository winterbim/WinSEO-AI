name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://serpvera:serpvera@localhost:5432/serpvera_test
      PG_SOCKET_DIR: localhost
      PGPORT: "5432"
      PGUSER: serpvera
      PGPASSWORD: serpvera
      PGDATABASE: serpvera_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serpvera
          POSTGRES_PASSWORD: serpvera
          POSTGRES_DB: serpvera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Prepare PostgreSQL roles and schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE serpvera_dev"
          pnpm --filter @serpvera/db db:migrate

      - name: Test
        run: pnpm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Scan all new commits, including merged side branches
        env:
          SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! [[ "$SCAN_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$SCAN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Secret scan received invalid base/head commit identifiers."
            exit 1
          fi
          gitleaks git --config .gitleaks.toml --redact --exit-code 2 \
            --log-opts="$SCAN_HEAD_SHA ^$SCAN_BASE_SHA" .

      - name: Verify side-branch secret detection
        run: bash scripts/security/test-gitleaks-branch-scan.sh
